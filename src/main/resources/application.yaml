spring:
  application:
    name: pickit-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pickit}
    username: ${DB_USERNAME:pickit_app}
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

pickit:
  cors:
    # 쉼표로 여러 주소를 넣는다. 배포 서버에서는 CORS_ALLOWED_ORIGINS 환경변수로 프론트 주소를 지정한다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
